name: Publish Guess You
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build public site
        run: python3 scripts/build_public.py "$RUNNER_TEMP/guess-you-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/guess-you-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
