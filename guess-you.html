<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Reenie+Beanie&display=swap">
<style>
/* Layout: a design-object world. Screen 1 = keychain tiles piled into a fading mountain,
   Screen 2 = the survivors hanging on a white matte board, Screen 3 = an ID badge in a clear sleeve.
   Deliberately single-theme (bright gallery white): every color is set explicitly below. */
:root {
  --bg: #F2F2EF;
  --board: #FFFFFF;
  --ink: #121212;
  --muted: #6A6A66;
  --line: #DCDCD7;
  --pen: #1F3A8A;
  --accent: #E8322B;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-hand: "Reenie Beanie", "Bradley Hand", "Segoe Print", cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
/* Layout display rules must never reveal hidden screens or sheets. */
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px; }
.logo { font-family: var(--font-display); font-weight: 900; font-stretch: 62%; font-variation-settings: "wdth" 62; text-transform: uppercase; letter-spacing: -.01em; line-height: .86; margin: 0; color: var(--ink); }
.logo-sm { font-size: 1.7rem; background: none; border: 0; padding: 0; }
.topbar .logo-sm { visibility: hidden; }
body[data-screen="s2"] .topbar .logo-sm, body[data-screen="s3"] .topbar .logo-sm { visibility: visible; }
.top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.mini { display: inline-flex; background: var(--board); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mini button { border: 0; background: none; border-radius: 999px; padding: 4px 11px; font-weight: 700; font-size: .8rem; color: var(--muted); }
.mini button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.gender { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: .9rem; }
.ghost { background: var(--board); border: 1px solid var(--line); border-radius: 999px; padding: 7px 15px; font-weight: 700; font-size: .85rem; letter-spacing: .02em; }
.ghost:hover { border-color: var(--ink); }

/* ---------- Screen 1 ---------- */
#s1 { text-align: center; padding-block: 4px 0; }
.hero-title { font-size: clamp(4rem, 17vw, 9.5rem); }
.tag { color: var(--muted); margin: 16px auto 28px; max-width: 36ch; font-size: 1.02rem; }
.feel-form { display: flex; align-items: flex-end; justify-content: center; gap: 14px; flex-wrap: wrap; }
.feel-form label { font: 900 clamp(1.6rem, 5vw, 2.4rem)/1 var(--font-display); font-variation-settings: "wdth" 62; font-stretch: 62%; text-transform: uppercase; padding-bottom: 8px; }
.feel-form input {
  font: 400 clamp(2.2rem, 7vw, 3.2rem)/1 var(--font-hand); color: var(--pen);
  background: transparent; border: 0; border-bottom: 2px solid var(--ink); border-radius: 0;
  padding: 2px 4px 4px; width: min(420px, 100%); min-width: 0;
}
.feel-form input::placeholder { color: var(--pen); opacity: .32; }
.feel-form input:focus-visible { outline: none; border-bottom-color: var(--accent); }
.go { background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 13px 26px; font: 800 1rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .08em; }
.go:hover { background: var(--accent); }
.try { margin: 18px auto 0; display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; align-items: baseline; color: var(--muted); font-size: .9rem; }
.try button { background: none; border: 0; padding: 0; color: var(--pen); font: 400 1.55rem/1 var(--font-hand); }
.try button:hover { color: var(--accent); }

.mountain {
  position: relative; margin-top: 34px; padding-top: 10px; padding-bottom: 10px; overflow: hidden;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
          mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%);
}
.m-row { display: flex; justify-content: center; gap: var(--g); width: max-content; margin-left: 50%; transform: translateX(-50%); }
.m-row + .m-row { margin-top: calc(var(--w) * -0.5); }
.mountain .tile { pointer-events: none; }

/* ---------- Keychain tiles ---------- */
.tile { width: var(--w, 120px); flex: 0 0 auto; perspective: 700px; position: relative; padding-top: calc(var(--w) * .13); }
.tile-body {
  position: relative; transform-origin: 50% 100%; transition: transform .45s cubic-bezier(.3,.7,.3,1.2), filter .45s;
  background: linear-gradient(140deg, rgb(255 255 255 / .96) 0%, rgb(246 248 250 / .82) 45%, rgb(255 255 255 / .94) 100%);
  border: 1px solid rgb(0 0 0 / .09); border-radius: calc(var(--w) * .09);
  padding: calc(var(--w) * .13) calc(var(--w) * .06) calc(var(--w) * .05);
  box-shadow: inset 0 1px 0 #fff, inset 0 -2px 4px rgb(0 0 0 / .04), 0 8px 18px -6px rgb(0 0 0 / .22), 0 1px 2px rgb(0 0 0 / .12);
}
.tile-body::before { /* hole drilled in the acrylic */
  content: ""; position: absolute; top: calc(var(--w) * .035); left: 50%; transform: translateX(-50%);
  width: calc(var(--w) * .07); height: calc(var(--w) * .07); border-radius: 50%; background: var(--bg); box-shadow: inset 0 1px 2px rgb(0 0 0 / .35);
}
.tile-body::after { /* gloss */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgb(255 255 255 / .55) 42%, transparent 55%);
}
.ring {
  position: absolute; top: calc(var(--w) * -.13); left: 50%; transform: translateX(-50%); z-index: 2;
  width: calc(var(--w) * .2); height: calc(var(--w) * .2); border-radius: 50%;
  border: calc(var(--w) * .022) solid #B4B7BD; box-shadow: inset 0 1px 0 #F3F4F6, 0 1px 1.5px rgb(0 0 0 / .3);
}
.tile.down .tile-body { transform: rotateX(-76deg); filter: brightness(.88); }
.tile-window { display: block; width: 100%; aspect-ratio: 4 / 5; border-radius: calc(var(--w) * .035); overflow: hidden; position: relative; border: 0; padding: 0; background: var(--wbg, #ccc); }
.tile-window svg { display: block; width: 100%; height: 100%; filter: drop-shadow(calc(var(--w) * .035) calc(var(--w) * .02) calc(var(--w) * .015) rgb(0 0 0 / .35)); }
.tile-window img { display: block; width: 100%; height: 100%; object-fit: cover; }
.plate {
  display: block; margin-top: calc(var(--w) * .05); color: var(--pen);
  font: 400 calc(var(--w) * .2)/1 var(--font-hand); text-align: center;
  padding: 0 2px; min-height: calc(var(--w) * .2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tile.faux .plate { text-decoration: underline wavy rgb(0 0 0 / .35); text-decoration-thickness: 1px; text-underline-offset: 3px; }
.photo-wash { position: absolute; inset: 0; background: var(--wbg); mix-blend-mode: multiply; opacity: .25; }
.photo-img { filter: contrast(1.1) saturate(1.05); }
.sticker { position: absolute; right: 5%; bottom: 5%; width: 34%; aspect-ratio: 1; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / .3); overflow: hidden; }
.sticker svg { width: 100%; height: 100%; filter: none; }

/* ---------- Screen 2 ---------- */
.said-line { text-align: center; margin: 4px 0 4px; font: 900 clamp(1.6rem, 5vw, 2.4rem)/1.1 var(--font-display); font-variation-settings: "wdth" 62; font-stretch: 62%; text-transform: uppercase; }
.said { background: none; border: 0; padding: 0 4px; font: 400 1.5em/1 var(--font-hand); text-transform: none; color: var(--pen); text-decoration: underline wavy var(--accent); text-underline-offset: 6px; text-decoration-thickness: 2px; }
.said:hover { color: var(--accent); }
.hint { text-align: center; color: var(--muted); margin: 12px auto 22px; max-width: 48ch; min-height: 3em; }
.hint strong { color: var(--ink); }
.tray {
  background: var(--board); border-radius: 28px; padding: 40px 18px 24px;
  box-shadow: 0 1px 0 #fff inset, 0 0 0 1px rgb(0 0 0 / .04), 0 40px 70px -30px rgb(0 0 0 / .28), 0 8px 18px -10px rgb(0 0 0 / .12);
}
.board { display: flex; flex-wrap: wrap; justify-content: center; gap: 26px 18px; }
.board .tile { --w: clamp(98px, 27vw, 142px); opacity: 0; animation: rise .5s cubic-bezier(.3,.7,.3,1.25) forwards; animation-delay: calc(var(--i) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(-18px) rotate(-6deg); } to { opacity: 1; transform: none; } }
.board .tile-window { cursor: pointer; }
.board .tile-window:hover { outline: 3px solid var(--ink); outline-offset: -3px; }
.slot { display: flex; justify-content: center; margin-top: 10px; }
.flip { background: var(--board); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .76rem; font-weight: 700; letter-spacing: .03em; }
.flip:hover { color: var(--ink); border-color: var(--ink); }
.tile.last .tile-body { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px var(--ink), 0 14px 26px -8px rgb(0 0 0 / .35); } }
.below { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 30px 0 40px; }

/* ---------- Screen 3: the badge ---------- */
.back { background: none; border: 0; padding: 4px 0; font-weight: 700; color: var(--muted); }
.back:hover { color: var(--ink); }
.detail { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 44px; align-items: start; margin: 22px 0 48px; }
.sleeve {
  position: relative; border-radius: 16px; padding: 46px 14px 16px;
  background: linear-gradient(155deg, rgb(255 255 255 / .85), rgb(232 236 240 / .7) 55%, rgb(255 255 255 / .9));
  border: 1px solid rgb(0 0 0 / .12); box-shadow: inset 0 1px 0 #fff, 0 30px 50px -24px rgb(0 0 0 / .4), 0 2px 4px rgb(0 0 0 / .08);
  transform: rotate(-2deg);
}
.sleeve::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(120deg, transparent 35%, rgb(255 255 255 / .5) 45%, transparent 58%); }
.sleeve-slot { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: 76px; height: 12px; border-radius: 6px; background: var(--bg); box-shadow: inset 0 1px 3px rgb(0 0 0 / .4); }
.sleeve-hole { position: absolute; top: 15px; width: 13px; height: 13px; border-radius: 50%; background: var(--bg); box-shadow: inset 0 1px 3px rgb(0 0 0 / .4); }
.card { background: #fff; border: 1px solid #D8D8D4; padding: 14px 14px 12px; }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.card-head b { font: 900 2rem/.82 var(--font-display); font-variation-settings: "wdth" 62; font-stretch: 62%; text-transform: uppercase; }
.card-head small { font-size: .56rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: right; line-height: 1.3; }
.card-body { display: grid; grid-template-columns: 46% 1fr; gap: 12px; margin-top: 12px; }
.card-photo { --w: 130px; aspect-ratio: 4 / 5; overflow: hidden; position: relative; background: var(--wbg); }
.card-photo svg { width: 100%; height: 100%; display: block; filter: drop-shadow(4px 3px 2px rgb(0 0 0 / .35)); }
.card-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card dl { margin: 0; min-width: 0; }
.card dt { font-size: .56rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--line); padding-top: 3px; }
.card dt:first-child { border-top: 0; padding-top: 0; }
.card dd { margin: 0 0 6px; font: 400 1.45rem/1 var(--font-hand); color: var(--pen); overflow-wrap: anywhere; }
.card-foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; border-top: 2px solid var(--ink); padding-top: 6px; }
.card-foot .hand { font: 400 1.5rem/1 var(--font-hand); color: var(--pen); }
.card-foot small { font-size: .62rem; font-weight: 800; letter-spacing: .1em; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font: 800 .74rem/1 var(--font-body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--fc); }
.detail h2 { margin: 10px 0 16px; font: 900 clamp(2.6rem, 8vw, 4.4rem)/.9 var(--font-display); font-variation-settings: "wdth" 62; font-stretch: 62%; text-transform: uppercase; text-wrap: balance; }
.detail h2 em { display: block; font: 400 1.15em/1 var(--font-hand); text-transform: none; color: var(--pen); }
.detail h3 { margin: 28px 0 10px; font: 900 1.2rem/1 var(--font-display); font-variation-settings: "wdth" 62; font-stretch: 62%; text-transform: uppercase; letter-spacing: .02em; }
.note { background: var(--board); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; max-width: 62ch; }
.note p { margin: 0 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--board); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .93rem; display: inline-flex; gap: 6px; align-items: baseline; }
.chip small { color: var(--muted); font-weight: 500; font-size: .72rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .7; }
.chip:hover { border-color: var(--ink); }
.open-link { background: none; border: 0; padding: 0; color: var(--muted); font-size: .88rem; text-decoration: underline; }
details.all { margin-top: 12px; }
details.all summary { cursor: pointer; color: var(--muted); font-weight: 600; }
.cat { margin-top: 12px; }
.cat h4 { margin: 0 0 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.say { margin-top: 30px; background: var(--board); border-radius: 18px; padding: 20px; box-shadow: 0 0 0 1px rgb(0 0 0 / .05), 0 24px 40px -26px rgb(0 0 0 / .3); }
.say h3 { margin-top: 0; }
.say .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.say label { display: grid; gap: 4px; font-size: .78rem; font-weight: 700; color: var(--muted); }
.say input { font: 400 1.6rem/1.1 var(--font-hand); color: var(--pen); background: transparent; border: 0; border-bottom: 1.5px solid var(--line); border-radius: 0; padding: 2px 2px 4px; min-width: 0; }
.say input:focus-visible { outline: none; border-bottom-color: var(--ink); }
.say input::placeholder { color: var(--pen); opacity: .3; }
.sentence { font-size: 1.3rem; line-height: 1.45; font-weight: 600; margin: 18px 0 14px; max-width: 60ch; }
.sentence b { font: 400 1.35em/1 var(--font-hand); color: var(--pen); }
.sentence .blank { color: var(--muted); font-weight: 500; }
.copy { background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .82rem; }
.copy:hover { background: var(--accent); }

/* ---------- Sheets ---------- */
.backdrop { position: fixed; inset: 0; background: rgb(18 18 18 / .45); display: grid; place-items: center; padding: 16px; z-index: 10; }
.sheet { background: var(--board); color: var(--ink); border-radius: 22px; width: min(560px, 100%); max-height: 88vh; overflow: auto; padding: 22px 22px 26px; box-shadow: 0 30px 60px rgb(0 0 0 / .3); }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet h2 { margin: 0; font: 900 1.8rem/1 var(--font-display); font-variation-settings: "wdth" 62; font-stretch: 62%; text-transform: uppercase; }
.x { background: none; border: 0; font-size: 1.6rem; line-height: 1; padding: 4px 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 16px 0; background: var(--bg); padding: 5px; border-radius: 999px; }
.seg button { border: 0; background: none; border-radius: 999px; padding: 8px 6px; font-weight: 700; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.maker { display: grid; grid-template-columns: 130px 1fr; gap: 20px; align-items: start; }
.maker .tile { --w: 130px; }
.opts { display: grid; gap: 12px; }
.opts h4 { margin: 0 0 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgb(0 0 0 / .15); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--board), 0 0 0 5px var(--ink); }
.styles button { border: 1px solid var(--line); background: var(--board); border-radius: 999px; padding: 5px 12px; font-size: .84rem; font-weight: 600; text-transform: capitalize; }
.styles button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.fine { color: var(--muted); font-size: .88rem; }
.upload { display: inline-block; background: var(--ink); color: #fff; border-radius: 999px; padding: 10px 18px; font-weight: 800; cursor: pointer; }
.upload input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.res { display: grid; gap: 14px; margin-top: 14px; }
.res h3 { margin: 0 0 4px; font-size: 1rem; }
.res p { margin: 0; color: var(--muted); }
.res a { color: var(--ink); font-weight: 700; }
.crisis { border-left: 4px solid var(--accent); padding-left: 12px; }
.credit { color: var(--muted); font-size: .78rem; text-align: center; padding-block: 8px 24px; }

@media (max-width: 720px) {
  .detail { grid-template-columns: 1fr; gap: 26px; }
  .sleeve { max-width: 320px; margin: 0 auto; width: 100%; }
  .say .fields { grid-template-columns: 1fr; }
  .maker { grid-template-columns: 1fr; }
  .maker .tile { margin: 0 auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="topbar">
    <button class="logo logo-sm" id="homeBtn" data-t="name">Guess You</button>
    <div class="top-actions">
      <div class="mini" id="langSeg" role="group" aria-label="Language / Idioma"><button data-lang="en">EN</button><button data-lang="pt">PT</button></div>
      <button class="ghost" id="facesBtn" data-t="faces"></button>
      <button class="ghost" id="resBtn" data-t="resources"></button>
    </div>
  </header>

  <main>
    <section id="s1" aria-labelledby="t1">
      <h1 class="logo hero-title" id="t1" data-t="name">Guess You</h1>
      <p class="tag" data-t="tag"></p>
      <form class="feel-form" id="feelForm" autocomplete="off">
        <label for="feelInput" data-t="ifeel"></label>
        <input id="feelInput" name="feel" maxlength="60">
        <button class="go" type="submit" data-t="guess"></button>
      </form>
      <div class="try" id="tryRow"></div>
      <div class="gender" id="genderRow" hidden><span id="gLabel" data-t="genderLabel"></span>
        <div class="mini" id="genderSeg" role="group" aria-labelledby="gLabel"><button data-g="a">ela</button><button data-g="o">ele</button><button data-g="e">elu</button><button data-g="ao">sem escolher</button></div>
      </div>
      <div class="mountain" id="mountain" aria-hidden="true"></div>
    </section>

    <section id="s2" hidden aria-labelledby="t2">
      <p class="said-line" id="t2"><span data-t="ifeel"></span> <button class="said" id="saidBtn"></button></p>
      <p class="hint" id="hint" aria-live="polite"></p>
      <div class="tray"><div class="board" id="board"></div></div>
      <div class="below">
        <button class="ghost" id="moreBtn" data-t="more"></button>
        <button class="ghost" id="standBtn" data-t="stand"></button>
      </div>
    </section>

    <section id="s3" hidden>
      <button class="back" id="backBtn" data-t="back"></button>
      <div class="detail" id="detail"></div>
    </section>
  </main>
  <p class="credit" data-t="credit"></p>
</div>

<div class="backdrop" id="facesSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fh">
    <div class="sheet-head"><h2 id="fh" data-t="facesTitle"></h2><button class="x" data-close>×</button></div>
    <div class="seg" id="modeSeg">
      <button data-mode="many" data-t="many"></button>
      <button data-mode="avatar" data-t="build"></button>
      <button data-mode="photo" data-t="photo"></button>
    </div>
    <div id="modeBody"></div>
  </div>
</div>

<div class="backdrop" id="resSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rh">
    <div class="sheet-head"><h2 id="rh" data-t="resTitle"></h2><button class="x" data-close>×</button></div>
    <div class="res" id="resBody"></div>
  </div>
</div>

<script>
const D = {
 "families": [
  {
   "id": "angry",
   "label": "Angry",
   "pt": "Raiva",
   "expr": "angry",
   "color": "#E8322B"
  },
  {
   "id": "sad",
   "label": "Sad",
   "pt": "Tristeza",
   "expr": "sad",
   "color": "#2F5BE0"
  },
  {
   "id": "afraid",
   "label": "Afraid",
   "pt": "Medo",
   "expr": "afraid",
   "color": "#8A5CF6"
  },
  {

    ? `<button class="tile-window" style="--wbg:${bgOf(f)}" data-open="${f.id}" aria-label="${t().open} ${W(f.id)}">${portrait(f, opts.seed)}</button>`
    : `<span class="tile-window" style="--wbg:${bgOf(f)}">${portrait(f, opts.seed)}</span>`;
  const slot = opts.interactive ? `<div class="slot"><button class="flip" data-flip="${f.id}">${t().notMe}</button></div>` : '';
  return `<div class="tile${f.family === 'faux' ? ' faux' : ''}" style="--fc:${color};${opts.style || ''}" data-id="${f.id}"><div class="tile-body"><span class="ring"></span>${win}${plate}</div>${slot}</div>`;
}

/* ---------- screen 1: the mountain ---------- */
const ROWS = [7, 9, 11, 13, 15, 17, 19];
function renderMountain() {
  const r = rng(7);
  const narrow = innerWidth < 600;
  $('#mountain').innerHTML = ROWS.map((count, i) => {
    const w = Math.round((narrow ? 24 : 32) + i * (narrow ? 6 : 8.5));
    const op = (0.18 + 0.82 * (i / (ROWS.length - 1)) ** 1.4).toFixed(2);
    const tiles = Array.from({ length: count }, (_, j) => {
      const f = REAL[r() * REAL.length | 0];
      return tileHTML(f, { plate: i === ROWS.length - 1 ? undefined : false, seed: `m${i}-${j}` });
    }).join('');
    return `<div class="m-row" style="--w:${w}px;--g:${Math.round(w * .16)}px;opacity:${op}">${tiles}</div>`;
  }).join('');
}
let idle = null;
function startIdle() {
  stopIdle();
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  idle = setInterval(() => {
    const tiles = document.querySelectorAll('#mountain .tile:not(.down)');
    if (!tiles.length) return;
    const t = tiles[Math.random() * tiles.length | 0];
    t.classList.add('down');
    setTimeout(() => t.classList.remove('down'), 1700);
  }, 420);
}
function stopIdle() { clearInterval(idle); idle = null; }

function renderTry() {
  $('#tryRow').innerHTML = `<span>${t().try}</span>`;
  t().tries.forEach(w => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = gw(w);
    b.onclick = () => { $('#feelInput').value = gw(w); guess(gw(w)); };
    $('#tryRow').append(b);
  });
}

/* ---------- matching ---------- */
function norm(s) {
  let t = strip(s.toLowerCase()).replace(/[’`]/g, "'").replace(/[^a-z0-9' -]/g, ' ').replace(/\s+/g, ' ').trim();
  const pre = /^(i'?m feeling|i am feeling|im feeling|i feel|i'?m|i am|im|feeling|eu me sinto|me sinto|eu estou|eu to|eu tou|estou|sinto|to|tou|eu|so)\s+/;
  while (pre.test(t)) t = t.replace(pre, '');
  const u = t.replace(/(^|\s)(really|very|super|kinda|kind of|pretty|a bit|a little|totally|so|muito|meio|tao|bem|bastante)(?=\s|$)/g, ' ').replace(/\s+/g, ' ').trim();
  return u || t;
}
function detectGender(t) {
  for (const k of GKEYS) if ((' ' + t + ' ').includes(' ' + k + ' ')) return GENDERED[k];
  return null;
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
const has = (t, p) => (' ' + t + ' ').includes(' ' + p + ' ');
function forFeeling(id) {
  const f = FEEL[id];
  if (f.family === 'faux') return [id, ...f.underlying, ...D.feelings.filter(x => x.family === 'faux' && x.id !== id && x.underlying.some(u => f.underlying.includes(u))).slice(0, 3).map(x => x.id)];
  const sibs = REAL.filter(x => x.family === f.family && x.id !== id).map(x => x.id).slice(0, 6);
  const faux = D.feelings.filter(x => x.family === 'faux' && x.underlying.includes(id)).slice(0, 3).map(x => x.id);
  return [id, ...sibs, ...faux];
}
function match(raw) {
  const t = norm(raw);
  if (!t) return null;
  if (ALIAS[t]) return { ids: forFeeling(ALIAS[t]) };
  for (const tr of TRIG) if (tr.phrases.includes(t)) return { ids: tr.feelings };
  const phrases = TRIG.flatMap(tr => tr.phrases.map(p => [p, tr])).sort((a, b) => b[0].length - a[0].length);
  const hitFeel = [...new Set(Object.keys(ALIAS).filter(k => has(t, k)).map(k => ALIAS[k]))];
  const hitTrig = phrases.filter(([p]) => has(t, p)).map(([, tr]) => tr);
  if (hitFeel.length || hitTrig.length) {
    const ids = [...hitFeel.flatMap(forFeeling).slice(0, hitFeel.length > 1 ? 99 : 10), ...hitTrig.flatMap(tr => tr.feelings)];
    return { ids: [...new Set([...hitFeel, ...ids])].slice(0, 12) };
  }
  let best = null, bd = 99;
  for (const k of [...Object.keys(ALIAS), ...phrases.map(p => p[0])]) {
    const dd = lev(t, k);
    if (dd < bd) { bd = dd; best = k; }
  }
  if (best && bd <= (t.length > 5 ? 2 : 1)) { const m = match(best); m.fixed = ALIAS[best] ? W(ALIAS[best]) : best; return m; }
  const r = rng(hash(t));
  const spread = ['angry', 'sad', 'afraid', 'tense', 'disconnected', 'tired', 'confused', 'vulnerable']
    .map(fam => { const opts = REAL.filter(x => x.family === fam); return opts[r() * opts.length | 0].id; });
  return { ids: [...spread, 'misunderstood', 'pressured'], unknown: true };
}

/* ---------- screen 2: the board ---------- */
function guess(raw) {
  const m = match(raw);
  if (!m) { $('#feelInput').focus(); return; }
  const g = detectGender(norm(raw));
  if (g) { m.genderNote = g; if (g !== state.gender || state.lang !== 'pt') { state.gender = g; state.lang = 'pt'; applyLang(); } }
  state.said = raw.trim(); state.shown = m.ids; state.down = new Set(); state.meta = m;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  stopIdle();
  const rows = [...document.querySelectorAll('#mountain .m-row')];
  rows.forEach((row, i) => row.querySelectorAll('.tile').forEach((t, j) => {
    t.querySelector('.tile-body').style.transitionDelay = `${(rows.length - i) * 55 + (j % 5) * 20}ms`;
    t.classList.add('down');
  }));
  setTimeout(() => {
    rows.forEach(row => row.querySelectorAll('.tile').forEach(t => { t.classList.remove('down'); t.querySelector('.tile-body').style.transitionDelay = ''; }));
    renderBoard(); show('s2');
  }, reduce ? 0 : 650);
}
function renderBoard() {
  $('#saidBtn').textContent = state.said;
  $('#board').innerHTML = state.shown.map((id, i) => tileHTML(FEEL[id], { interactive: true, style: `--i:${i}` })).join('');
  const famsShown = new Set(state.shown.map(id => FEEL[id].family));
  $('#moreBtn').hidden = !REAL.some(f => famsShown.has(f.family) && !state.shown.includes(f.id));
  updateHint();
}
function updateHint() {
  const standing = state.shown.filter(id => !state.down.has(id));
  document.querySelectorAll('#board .tile').forEach(t => {
    const isDown = state.down.has(t.dataset.id);
    t.classList.toggle('down', isDown);
    t.classList.toggle('last', standing.length === 1 && !isDown);
    t.querySelector('.flip').textContent = isDown ? T[state.lang].standUp : T[state.lang].notMe;
  });
  const m = state.meta || {};
  let msg;
  const L = t();
  if (standing.length === 1) msg = L.hintOne(W(standing[0]));
  else if (standing.length === 0) msg = L.hintNone;
  else if (m.unknown) msg = L.hintUnknown(esc(state.said), standing.length);
  else msg = (m.genderNote ? L.hintGender(m.genderNote) : '') + (m.fixed ? L.hintFixed(m.fixed) : '') + L.hintMain(standing.length);
  $('#hint').innerHTML = msg;
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
$('#board').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'), fl = e.target.closest('[data-flip]');
  if (fl) { const id = fl.dataset.flip; state.down.has(id) ? state.down.delete(id) : state.down.add(id); updateHint(); }
  else if (o) { if (state.down.has(o.dataset.open)) { state.down.delete(o.dataset.open); updateHint(); } else openFeeling(o.dataset.open); }
});
$('#moreBtn').onclick = () => {
  const famsShown = new Set(state.shown.map(id => FEEL[id].family));
  const extra = REAL.filter(f => famsShown.has(f.family) && !state.shown.includes(f.id)).slice(0, 6).map(f => f.id);
  state.shown = [...state.shown, ...extra];
  const keep = new Set(state.down); renderBoard(); state.down = keep; updateHint();
};
$('#standBtn').onclick = () => { state.down.clear(); updateHint(); };
$('#saidBtn').onclick = () => { $('#feelInput').value = state.said; show('s1'); $('#feelInput').focus(); $('#feelInput').select(); };

/* ---------- screen 3: one feeling ---------- */
const GER = { 'to be heard': 'being heard', 'to be seen': 'being seen', 'to matter': 'mattering' };
const andList = a => a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ` ${t().and} ` + a[a.length - 1];
function openFeeling(id) {
  const f = FEEL[id];
  state.current = id; state.selNeeds = new Set([f.needs[0]]); state.selUnder = f.family === 'faux' ? f.underlying[0] : null;
  renderDetail(); show('s3');
}
function renderDetail() {
  const f = FEEL[state.current], fam = FAM[f.family], faux = f.family === 'faux';
  const positive = f.family === 'joyful' || f.family === 'peaceful';
  const L = t();
  const needChip = n => `<button class="chip" data-need="${n}" aria-pressed="${state.selNeeds.has(n)}">${N(n)} <small>${CAT(NEEDCAT[n])}</small></button>`;
  const others = Object.entries(D.needCategories).map(([c, arr]) =>
    `<div class="cat"><h4>${CAT(c)}</h4><div class="chips">${arr.filter(n => !f.needs.includes(n)).map(needChip).join('')}</div></div>`).join('');
  $('#detail').style.setProperty('--fc', fam.color);
  $('#detail').innerHTML = `
    <div class="sleeve"><span class="sleeve-hole" style="left:22px"></span><span class="sleeve-slot"></span><span class="sleeve-hole" style="right:22px"></span>
      <div class="card">
        <div class="card-head"><b>${L.name.replace(' ', '<br>')}.</b><small>${L.cardSub}</small></div>
        <div class="card-body">
          <div class="card-photo" style="--wbg:${bgOf(f)}">${portrait(f)}</div>
          <dl><dt>${L.cardFeeling}</dt><dd>${W(faux ? state.selUnder : f.id)}</dd><dt>${L.cardFamily}</dt><dd>${faux ? L.cardThought : FAMLABEL(fam)}</dd><dt>${L.cardNeeds}</dt><dd id="cardNeeds"></dd></dl>
        </div>
        <div class="card-foot"><span class="hand">${faux ? '“' + W(f.id) + '”' : ''}</span><small>${String(D.families.indexOf(fam) + 1).padStart(2, '0')}–${String(D.feelings.indexOf(f) + 1).padStart(3, '0')}</small></div>
      </div>
    </div>
    <div>
      <span class="eyebrow"><span class="dot"></span>${faux ? L.thought : L.family(FAMLABEL(fam))}</span>
      <h2>${L.ifeel} <em>${W(f.id)}</em></h2>
      ${faux ? `<div class="note"><p>${L.fauxNote(W(f.id))}</p>
        <div class="chips">${f.underlying.map(u => `<button class="chip" data-under="${u}" aria-pressed="${state.selUnder === u}">${W(u)}</button>`).join('')}</div>
        <p style="margin:10px 0 0"><button class="open-link" data-go="${state.selUnder}">${L.openOwn(W(state.selUnder))}</button></p></div>` : ''}
      <h3>${positive ? L.met : L.unmet}</h3>
      <div class="chips">${f.needs.map(needChip).join('')}</div>
      <details class="all"><summary>${L.seeAll(Object.keys(NEEDCAT).length)}</summary>${others}</details>
      <div class="say">
        <h3>${L.say}</h3>
        <div class="fields">
          <label for="obsInput">${L.obsL}<input id="obsInput" placeholder="${L.obsPh}" value="${esc(state.obs || '')}"></label>
          <label for="reqInput">${L.reqL}<input id="reqInput" placeholder="${L.reqPh}" value="${esc(state.req || '')}"></label>
        </div>
        <p class="sentence" id="sentence"></p>
        <button class="copy" id="copyBtn">${L.copy}</button>
      </div>
    </div>`;
  renderSentence();
}
const cap = s => s[0].toUpperCase() + s.slice(1);
function sentenceParts() {
  const f = FEEL[state.current], positive = f.family === 'joyful' || f.family === 'peaceful';
  const feeling = W(f.family === 'faux' ? state.selUnder : f.id);
  const needs = [...state.selNeeds];
  const obs = (state.obs || '').trim(), req = (state.req || '').trim().replace(/[?.!]+$/, '');
  return { feeling, needs, obs, req, positive };
}
function renderSentence() {
  const { feeling, needs, obs, req, positive } = sentenceParts();
  const L = t();
  const list = needs.map(x => state.lang === 'en' && positive ? (GER[x] || x) : N(x));
  const n = needs.length ? `<b>${andList(list)}</b>` : `<span class="blank">${L.blankNeed}</span>`;
  const cn = $('#cardNeeds'); if (cn) cn.textContent = needs.length ? needs.map(x => N(x)).join(', ') : '—';
  $('#sentence').innerHTML = L.sentence(obs ? esc(obs) : `<span class="blank">${L.blankObs}</span>`, feeling, n, positive, req ? esc(req) : '');
}
$('#detail').addEventListener('click', e => {
  const n = e.target.closest('[data-need]'), u = e.target.closest('[data-under]'), g = e.target.closest('[data-go]');
  if (n) { const k = n.dataset.need; state.selNeeds.has(k) ? state.selNeeds.delete(k) : state.selNeeds.add(k); document.querySelectorAll(`[data-need="${k}"]`).forEach(b => b.setAttribute('aria-pressed', state.selNeeds.has(k))); renderSentence(); }
  if (u) { state.selUnder = u.dataset.under; renderDetail(); }
  if (g) openFeeling(g.dataset.go);
  if (e.target.id === 'copyBtn') {
    const text = $('#sentence').textContent;
    const btn = e.target;
    const done = () => { btn.textContent = t().copied; setTimeout(() => btn.textContent = t().copy, 1600); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#sentence')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = t().selected; };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
  }
});
$('#detail').addEventListener('input', e => {
  if (e.target.id === 'obsInput') state.obs = e.target.value;
  if (e.target.id === 'reqInput') state.req = e.target.value;
  renderSentence();
});
$('#backBtn').onclick = () => { show('s2'); };

/* ---------- navigation ---------- */
function show(id) {
  ['s1', 's2', 's3'].forEach(s => $('#' + s).hidden = s !== id);
  document.body.dataset.screen = id;
  if (id === 's1') startIdle(); else stopIdle();
  if (id === 's2') updateHint();
  scrollTo({ top: 0 });
}
$('#feelForm').addEventListener('submit', e => { e.preventDefault(); guess($('#feelInput').value); });
$('#homeBtn').onclick = () => show('s1');

/* ---------- sheets ---------- */
function openSheet(el) { el.hidden = false; el.querySelector('[data-close]').focus(); }
document.querySelectorAll('.backdrop').forEach(b => {
  b.addEventListener('click', e => { if (e.target === b || e.target.closest('[data-close]')) b.hidden = true; });
});
addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelectorAll('.backdrop').forEach(b => b.hidden = true); });
$('#resBtn').onclick = () => openSheet($('#resSheet'));
$('#facesBtn').onclick = () => { renderFaces(); openSheet($('#facesSheet')); };
let sheetMode = null;
function renderFaces() {
  sheetMode = sheetMode || state.mode;
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === sheetMode));
  const sample = FEEL['frustrated'];
  const body = $('#modeBody'), L = t();
  if (sheetMode === 'many') {
    body.innerHTML = `<p class="fine">${L.manyText}</p>`;
  } else if (sheetMode === 'avatar') {
    const a = state.avatar;
    const sw = (key, list) => list.map(c => `<button class="sw" style="background:${c}" data-k="${key}" data-v="${c}" aria-label="${key} ${c}" aria-pressed="${a[key] === c}"></button>`).join('');
    body.innerHTML = `<div class="maker"><div>${tileHTML(sample)}</div><div class="opts">
      <div><h4>${L.skin}</h4><div class="swatches">${sw('skin', SKINS)}</div></div>
      <div><h4>${L.hair}</h4><div class="swatches styles">${STYLES.map(s => `<button data-k="style" data-v="${s}" aria-pressed="${a.style === s}">${L.styles[s]}</button>`).join('')}</div></div>
      <div><h4>${L.hairColor}</h4><div class="swatches">${sw('hair', HAIRC)}</div></div>
      <div><h4>${L.shirt}</h4><div class="swatches">${sw('shirt', SHIRTS)}</div></div>
      <div><h4>${L.glasses}</h4><div class="swatches styles"><button data-k="glasses" data-v="1" aria-pressed="${a.glasses}">${L.glasses.toLowerCase()}</button></div></div>
    </div></div><p class="fine">${L.avatarText}</p>`;
  } else {
    body.innerHTML = `<div class="maker"><div>${state.photo ? tileHTML(sample) : `<p class="fine">${L.noPhoto}</p>`}</div><div class="opts">
      <label class="upload" for="photoIn">${L.choose}<input type="file" id="photoIn" accept="image/*"></label>
      <p class="fine">${L.photoNote}</p>
      ${state.photo ? `<button class="ghost" id="rmPhoto">${L.remove}</button>` : ''}
    </div></div>`;
  }
}
$('#modeSeg').addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if (!b) return;
  sheetMode = b.dataset.mode;
  if (sheetMode !== 'photo' || state.photo) { state.mode = sheetMode; applyFaces(); }
  renderFaces();
});
$('#modeBody').addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (b) {
    const k = b.dataset.k;
    state.avatar = { ...state.avatar, [k]: k === 'glasses' ? !state.avatar.glasses : b.dataset.v };
    state.mode = 'avatar'; applyFaces(); renderFaces();
  }
  if (e.target.id === 'rmPhoto') { state.photo = null; state.mode = 'many'; sheetMode = 'photo'; applyFaces(); renderFaces(); }
});
$('#modeBody').addEventListener('change', e => {
  if (e.target.id !== 'photoIn' || !e.target.files[0]) return;
  const img = new Image();
  img.onload = () => {
    const W = 200, H = 240, c = document.createElement('canvas'); c.width = W; c.height = H;
    const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
    c.getContext('2d').drawImage(img, (W - w) / 2, Math.min(0, (H - h) * 0.3), w, h);
    state.photo = c.toDataURL('image/jpeg', .85); state.mode = 'photo';
    URL.revokeObjectURL(img.src); applyFaces(); renderFaces();
  };
  img.src = URL.createObjectURL(e.target.files[0]);
});
function refreshAll() {
  renderMountain();
  if (state.shown.length) {
    const keep = new Set(state.down); renderBoard(); state.down = keep; updateHint();
    document.querySelectorAll('#board .tile').forEach(t => { t.style.animation = 'none'; t.style.opacity = 1; });
  }
  if (state.current) renderDetail();
  if (!$('#facesSheet').hidden) renderFaces();
}
function applyFaces() { saveFaces(); refreshAll(); }
function applyLang() {
  const L = t();
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = L[el.dataset.t]);
  document.title = L.name;
  $('#feelInput').placeholder = L.ph;
  $('#saidBtn').title = L.change;
  $('#homeBtn').setAttribute('aria-label', L.home);
  document.querySelectorAll('[data-close]').forEach(b => b.setAttribute('aria-label', L.close));
  $('#resBody').innerHTML = L.res;
  document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === state.lang));
  document.querySelectorAll('#genderSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === state.gender));
  $('#genderRow').hidden = state.lang !== 'pt';
  try { localStorage.setItem('guessyou-lang', JSON.stringify({ lang: state.lang, gender: state.gender })); } catch (e) {}
  renderTry(); refreshAll();
}
$('#langSeg').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) { state.lang = b.dataset.lang; applyLang(); } });
$('#genderSeg').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) { state.gender = b.dataset.g; applyLang(); } });

/* ---------- boot ---------- */
applyLang();
show('s1');
let rz, wasNarrow = innerWidth < 600;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const n = innerWidth < 600; if (n !== wasNarrow) { wasNarrow = n; renderMountain(); } }, 200); });
</script>
